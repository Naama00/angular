<div class="money-summary">
  <h2>סיכום כספי</h2>
  <div class="summary-cards">
    <div class="card">
      <h3>סך הכנסות</h3>
      <p class="amount">{{ totalEarnings | currency:'ILS':'symbol':'1.0-0' }}</p>
    </div>
    <div class="card">
      <h3>סך הוצאות</h3>
      <p class="amount">{{ totalExpenses | currency:'ILS':'symbol':'1.0-0' }}</p>
    </div>
    <div class="card">
      <h3>רווח נקי</h3>
      <p class="amount profit">{{ netProfit | currency:'ILS':'symbol':'1.0-0' }}</p>
    </div>
    <div class="card">
      <h3>הכנסה חודשית</h3>
      <p class="amount">{{ monthlyRevenue | currency:'ILS':'symbol':'1.0-0' }}</p>
    </div>
  </div>
</div>
