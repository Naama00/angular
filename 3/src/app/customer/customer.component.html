<div class="container">
  <h2><i class="fas fa-user-plus"></i> Customer Registration</h2>
  <form [formGroup]="customerForm" (ngSubmit)="onSubmit()" class="registration-form">
    <div class="form-group">
      <label for="name"><i class="fas fa-user"></i> Name:</label>
      <input id="name" type="text" formControlName="name" class="form-input">
      <div class="error" *ngIf="customerForm.get('name')?.invalid && customerForm.get('name')?.touched">
        Name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="email"><i class="fas fa-envelope"></i> Email:</label>
      <input id="email" type="email" formControlName="email" class="form-input">
      <div class="error" *ngIf="customerForm.get('email')?.invalid && customerForm.get('email')?.touched">
        Please enter a valid email.
      </div>
    </div>

    <div class="form-group">
      <label for="password"><i class="fas fa-lock"></i> Password:</label>
      <input id="password" type="password" formControlName="password" class="form-input">
      <div class="error" *ngIf="customerForm.get('password')?.invalid && customerForm.get('password')?.touched">
        Password must be at least 6 characters.
      </div>
    </div>

    <div class="form-group">
      <label for="phone"><i class="fas fa-phone"></i> Phone:</label>
      <input id="phone" type="tel" formControlName="phone" class="form-input">
    </div>
    <button type="submit" routerLink="/entrance"></button> [disabled]="customerForm.invalid" class="submit-btn"><i class="fas fa-paper-plane"></i> Register</button>
  </form>
</div>
