<div class="container">
  <h2><i class="fas fa-umbrella-beach"></i> Vacation Rentals</h2>
  <div class="apartments-grid">
    <div class="apartment-card" *ngFor="let apt of apartments">
      <h3>{{ apt.title }}</h3>
      <p><i class="fas fa-shekel-sign"></i> Nightly Rate: {{ apt.nightlyRate | currency:'ILS':'symbol':'1.0-0' }}</p>
      <p><i class="fas fa-map-marker-alt"></i> Location: {{ apt.location }}</p>
      <p><i class="fas fa-bed"></i> Bedrooms: {{ apt.bedrooms }}, <i class="fas fa-bath"></i> Bathrooms: {{ apt.bathrooms }}</p>
    </div>
  </div>
</div>
